<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ianua</title>
    <script>
      (() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const platform = (params.get('platform') || '').trim().toLowerCase();
          if (platform) {
            document.documentElement.dataset.platform = platform;
            return;
          }
          if (/android/i.test(navigator.userAgent || '')) {
            document.documentElement.dataset.platform = 'android';
          } else {
            document.documentElement.dataset.platform = 'ios';
          }
        } catch (_) {}
      })();
    </script>
    <style>
      /* Prima pagina Iànua: tema CHIARO (sfondo bianco). Le altre schermate
         dell'app restano scure. Colori/logo/testi arrivano dal `theme` nel
         payload (multi-tenant): qui restano i default del brand Iànua, che il
         JSON del server può sovrascrivere senza ricompilare. */
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #ffffff;
        --panel-strong: #f5f7fb;
        --line: rgba(11, 18, 32, 0.10);
        --line-strong: rgba(11, 18, 32, 0.16);
        --text: #0b1220;
        --muted: #55617a;
        --soft: #8a93a7;
        --accent: #2278f8;
        --accent-strong: #1560d8;
        --state: #7d8ca3;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
        background:
          radial-gradient(900px 640px at 12% 6%, color-mix(in srgb, var(--accent) 12%, transparent), rgba(255, 255, 255, 0) 60%),
          radial-gradient(820px 600px at 88% 12%, color-mix(in srgb, var(--accent) 7%, transparent), rgba(255, 255, 255, 0) 62%),
          var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -10%;
        pointer-events: none;
        background:
          repeating-linear-gradient(
            90deg,
            rgba(11, 18, 32, 0.03) 0,
            rgba(11, 18, 32, 0.03) 1px,
            transparent 1px,
            transparent 52px
          ),
          repeating-linear-gradient(
            0deg,
            rgba(11, 18, 32, 0.03) 0,
            rgba(11, 18, 32, 0.03) 1px,
            transparent 1px,
            transparent 52px
          );
        opacity: 0.5;
        transform: rotate(-7deg);
      }

      body[data-state="connected"] { --state: #23a45a; }
      body[data-state="connecting"] { --state: #d69a00; }
      body[data-state="error"] { --state: #e0483c; }
      body[data-state="offline"] { --state: #95a3b9; }

      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        z-index: 1;
      }

      #openclaw-home {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: calc(var(--safe-top) + 18px) 16px calc(var(--safe-bottom) + 18px);
        box-sizing: border-box;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      .shell {
        width: min(100%, 760px);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 16px;
        min-height: 100%;
        box-sizing: border-box;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 28px;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 20px 60px rgba(11, 18, 32, 0.08);
        padding: 28px 24px 22px;
        text-align: center;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: -40% -20% auto -20%;
        height: 260px;
        background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), rgba(0, 0, 0, 0) 70%);
        pointer-events: none;
      }

      .brand {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .brand-logo {
        display: block;
        height: 104px;
        width: auto;
        max-width: 72%;
        object-fit: contain;
        margin: 2px 0 4px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 7px 12px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        max-width: 100%;
        box-sizing: border-box;
      }

      .eyebrow-dot {
        flex: 0 0 auto;
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--state);
        box-shadow: 0 0 14px color-mix(in srgb, var(--state) 60%, transparent);
      }

      #openclaw-home-eyebrow {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hero h1 {
        margin: 18px 0 0;
        font-size: clamp(30px, 6.5vw, 46px);
        line-height: 1.0;
        letter-spacing: -0.04em;
        color: var(--text);
      }

      .hero p.subtitle {
        margin: 14px auto 0;
        font-size: 16px;
        line-height: 1.5;
        color: var(--muted);
        max-width: 34rem;
      }

      .hero p.marketing {
        margin: 16px auto 0;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
        max-width: 34rem;
      }

      .footer-note {
        margin-top: 4px;
        text-align: center;
        color: var(--soft);
        font-size: 12px;
        line-height: 1.45;
      }

      /* Striscia LED "alla KITT" (scanner Supercar): un blob luminoso scorre
         avanti/indietro su una barra segmentata. Colore = accento Iànua (blu). */
      .kitt {
        position: relative;
        height: 22px;
        margin: 24px auto 2px;
        max-width: 320px;
        border-radius: 999px;
        background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 12%, transparent), color-mix(in srgb, var(--accent) 4%, transparent));
        border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
        box-shadow: inset 0 0 14px rgba(11, 18, 32, 0.06), 0 0 22px color-mix(in srgb, var(--accent) 20%, transparent);
        overflow: hidden;
      }

      .kitt-scan {
        position: absolute;
        top: -20%;
        bottom: -20%;
        left: 0;
        width: 42%;
        border-radius: 999px;
        background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 98%, transparent), color-mix(in srgb, var(--accent) 42%, transparent) 58%, rgba(255, 255, 255, 0) 80%);
        filter: blur(1px) saturate(1.15);
        animation: kittScan 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
      }

      .kitt::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0) 0 9px, rgba(11, 18, 32, 0.12) 9px 12px);
        pointer-events: none;
      }

      @keyframes kittScan {
        from { transform: translateX(-45%); }
        to { transform: translateX(180%); }
      }

      #openclaw-status {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: flex-start;
        flex-direction: column;
        padding-top: calc(var(--safe-top) + 18px);
        pointer-events: none;
        z-index: 3;
      }

      #openclaw-status .card {
        text-align: center;
        padding: 16px 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid var(--line);
        box-shadow: 0 18px 60px rgba(11, 18, 32, 0.16);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }

      #openclaw-status .title {
        font: 600 20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
        color: var(--text);
      }

      #openclaw-status .subtitle {
        margin-top: 6px;
        font: 500 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        #openclaw-home {
          padding-left: 12px;
          padding-right: 12px;
        }

        .hero {
          border-radius: 24px;
          padding: 24px 18px 18px;
        }

        .hero h1 {
          font-size: 32px;
        }

        .brand-logo {
          height: 88px;
        }
      }

      @media (max-height: 760px) {
        #openclaw-home {
          padding-top: calc(var(--safe-top) + 14px);
          padding-bottom: calc(var(--safe-bottom) + 12px);
        }

        .shell {
          gap: 12px;
        }

        .hero {
          border-radius: 24px;
          padding: 20px 16px 16px;
        }

        .brand-logo {
          height: 76px;
        }

        .hero h1 {
          margin-top: 14px;
          font-size: clamp(26px, 7vw, 34px);
        }

        .hero p.subtitle,
        .hero p.marketing {
          margin-top: 10px;
          font-size: 14px;
          line-height: 1.45;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before,
        .kitt-scan {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body data-state="offline">
    <canvas id="openclaw-canvas"></canvas>
    <div id="openclaw-home">
      <div class="shell">
        <div class="hero">
          <div class="brand">
            <img id="openclaw-home-logo" class="brand-logo" src="ianua-logo.png" alt="Ianua" />
            <div class="eyebrow">
              <span class="eyebrow-dot"></span>
              <span id="openclaw-home-eyebrow">Ianua</span>
            </div>
          </div>
          <h1 id="openclaw-home-title">Ianua è pronta</h1>
          <p class="subtitle" id="openclaw-home-subtitle">
            Chat apre i canali Ianua. Telefono apre il client SIP.
          </p>
          <p class="marketing" id="openclaw-home-marketing">
            La tua postazione intelligente: chat, telefono e assistente in un unico posto. Ianua lavora con te.
          </p>

          <div class="kitt" aria-hidden="true">
            <span class="kitt-scan"></span>
          </div>
        </div>

        <div class="footer-note" id="openclaw-home-footer">
          Quando è connesso, il gateway può svegliare il telefono solo quando serve.
        </div>
      </div>
    </div>

    <div id="openclaw-status">
      <div class="card">
        <div class="title" id="openclaw-status-title">Pronta</div>
        <div class="subtitle" id="openclaw-status-subtitle">In attesa dell'agente</div>
      </div>
    </div>

    <script>
      (() => {
        const canvas = document.getElementById('openclaw-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('openclaw-status');
        const titleEl = document.getElementById('openclaw-status-title');
        const subtitleEl = document.getElementById('openclaw-status-subtitle');
        const home = {
          root: document.getElementById('openclaw-home'),
          logo: document.getElementById('openclaw-home-logo'),
          eyebrow: document.getElementById('openclaw-home-eyebrow'),
          title: document.getElementById('openclaw-home-title'),
          subtitle: document.getElementById('openclaw-home-subtitle'),
          marketing: document.getElementById('openclaw-home-marketing'),
          footer: document.getElementById('openclaw-home-footer')
        };
        const debugStatusEnabledByQuery = (() => {
          try {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get('debugStatus') ?? params.get('debug');
            if (!raw) return false;
            const normalized = String(raw).trim().toLowerCase();
            return normalized === '1' || normalized === 'true' || normalized === 'yes';
          } catch (_) {
            return false;
          }
        })();
        let debugStatusEnabled = debugStatusEnabledByQuery;

        function resize() {
          const dpr = window.devicePixelRatio || 1;
          const width = Math.max(1, Math.floor(window.innerWidth * dpr));
          const height = Math.max(1, Math.floor(window.innerHeight * dpr));
          canvas.width = width;
          canvas.height = height;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function setDebugStatusEnabled(enabled) {
          debugStatusEnabled = !!enabled;
          if (!debugStatusEnabled) {
            statusEl.style.display = 'none';
          }
        }

        function setStatus(title, subtitle) {
          if (!debugStatusEnabled) return;
          if (!title && !subtitle) {
            statusEl.style.display = 'none';
            return;
          }
          statusEl.style.display = 'flex';
          if (typeof title === 'string') titleEl.textContent = title;
          if (typeof subtitle === 'string') subtitleEl.textContent = subtitle;
        }

        // Tema per-tenant: colori/logo/testi arrivano dal JSON del server.
        // Se un campo manca, resta il default del brand Iànua già nell'HTML.
        function applyTheme(theme) {
          if (!theme || typeof theme !== 'object') return;
          const root = document.documentElement.style;
          if (theme.background) root.setProperty('--bg', theme.background);
          if (theme.accent) root.setProperty('--accent', theme.accent);
          if (theme.accentStrong) root.setProperty('--accent-strong', theme.accentStrong);
          if (theme.text) root.setProperty('--text', theme.text);
          if (theme.muted) root.setProperty('--muted', theme.muted);
          if (home.logo && typeof theme.logo === 'string' && theme.logo) home.logo.src = theme.logo;
          if (home.marketing && typeof theme.marketing === 'string') home.marketing.textContent = theme.marketing;
        }

        function renderHome(state) {
          if (!state || typeof state !== 'object') return;

          document.body.dataset.state = state.gatewayState || 'offline';
          home.root.style.display = 'flex';
          applyTheme(state.theme);
          const setText = (el, val) => { if (el && typeof val === 'string') el.textContent = val; };
          setText(home.eyebrow, state.eyebrow || 'Ianua');
          setText(home.title, state.title || 'Ianua');
          setText(home.subtitle, state.subtitle || '');
          setText(home.footer, state.footer || '');
        }

        window.addEventListener('resize', resize);
        resize();

        if (!debugStatusEnabled) {
          statusEl.style.display = 'none';
        }

        window.__openclaw = {
          canvas,
          ctx,
          setDebugStatusEnabled,
          setStatus,
          renderHome
        };
      })();
    </script>
  </body>
</html>
